services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4100:4100"
    volumes:
      - incident-data:/app/data
    environment:
      - PORT=4100
      - DATABASE_PATH=/app/data/incidents.db

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      - server
    environment:
      - API_URL=http://server:4100

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:4100
      - VITE_WS_URL=ws://localhost:4100/realtime

volumes:
  incident-data:

